services:
  peopleinfo_server:
    build:
      context: ./PeopleInfo_Server
      dockerfile: Dockerfile
    image: peopleinfo_server
    container_name: peopleinfo_mcp_server
    ports:
      - "8001:8001"
    environment:
      - TRANSPORT=sse
      - HOST=0.0.0.0
      - PORT=8001
    command: ["--transport", "sse", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped

  randomnum_server:
    build:
      context: ./RandomNum_Server
      dockerfile: Dockerfile
    image: randomnum_server
    container_name: randomnum_mcp_server
    ports:
      - "8002:8002"
    environment:
      - TRANSPORT=sse
      - HOST=0.0.0.0
      - PORT=8002
    command: ["--transport", "sse", "--host", "0.0.0.0", "--port", "8002"]
    restart: unless-stopped
